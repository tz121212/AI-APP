name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve app version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 || 10#$minor > 999 || 10#$patch > 999 )); then
            echo "Version is outside the supported Android versionCode range"
            exit 1
          fi
          printf 'APP_VERSION_NAME=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'APP_VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daily-assistant-release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          gradle --no-daemon assembleRelease \
            -PreleaseStoreFile="$RUNNER_TEMP/daily-assistant-release.jks" \
            -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD" \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME"
      - name: Create update manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg versionName "$APP_VERSION_NAME" \
            --argjson versionCode "$APP_VERSION_CODE" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/app-release.apk" \
            --arg changelog "日常 $APP_VERSION_NAME 更新" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, changelog: $changelog}' \
            > android/app/build/outputs/apk/release/update-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/update-manifest.json
          generate_release_notes: true
