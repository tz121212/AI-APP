<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f6" />
    <meta name="description" content="日常备忘与待办" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>日常 · 备忘与待办</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <a class="brand" href="#today" aria-label="日常首页">
          <span class="brand-mark"><i data-lucide="check-check"></i></span>
          <span><strong>日常</strong><small>备忘与待办</small></span>
        </a>
        <button class="primary-button rail-create" id="rail-create" type="button"><i data-lucide="plus"></i><span>快速记录</span></button>
        <nav class="primary-nav">
          <button class="nav-item active" data-view="today" type="button"><i data-lucide="sun"></i><span>今天</span><span class="nav-count" id="today-count">0</span></button>
          <button class="nav-item" data-view="notes" type="button"><i data-lucide="notebook-pen"></i><span>备忘录</span></button>
          <button class="nav-item" data-view="calendar" type="button"><i data-lucide="calendar-days"></i><span>日历</span></button>
        </nav>
        <div class="rail-footer">
          <button class="nav-item" data-view="settings" type="button"><i data-lucide="settings-2"></i><span>设置与备份</span></button>
          <div class="workspace-label"><span class="status-dot"></span><span>内部工作空间</span></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark"><i data-lucide="check-check"></i></span><strong>日常</strong></div>
          <div class="page-heading">
            <p class="eyebrow" id="page-eyebrow">个人工作台</p>
            <h1 id="page-title">今天</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-box" for="global-search">
              <i data-lucide="search"></i>
              <input id="global-search" type="search" placeholder="搜索备忘和待办" autocomplete="off" />
              <kbd>⌘ K</kbd>
            </label>
            <button class="primary-button top-create" id="top-create" type="button"><i data-lucide="plus"></i><span>新建</span></button>
          </div>
        </header>
        <div class="content-area" id="view-root" tabindex="-1"></div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="底部导航">
      <button class="mobile-nav-item active" data-view="today" type="button"><i data-lucide="sun"></i><span>今天</span></button>
      <button class="mobile-nav-item" data-view="notes" type="button"><i data-lucide="notebook-pen"></i><span>备忘</span></button>
      <button class="mobile-add" id="mobile-create" type="button" aria-label="快速记录"><i data-lucide="plus"></i></button>
      <button class="mobile-nav-item" data-view="calendar" type="button"><i data-lucide="calendar-days"></i><span>日历</span></button>
      <button class="mobile-nav-item" data-view="settings" type="button"><i data-lucide="settings-2"></i><span>设置</span></button>
    </nav>

    <dialog class="editor-dialog" id="editor-dialog">
      <form id="editor-form" class="editor-form">
        <div class="dialog-heading">
          <div><p class="eyebrow">快速记录</p><h2 id="editor-heading">新建事项</h2></div>
          <button class="icon-button" id="close-editor" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="segmented-control" role="group" aria-label="记录类型">
          <button type="button" class="segment active" data-kind="task"><i data-lucide="check-square-2"></i>待办</button>
          <button type="button" class="segment" data-kind="note"><i data-lucide="sticky-note"></i>备忘</button>
        </div>
        <input type="hidden" name="kind" value="task" />
        <input type="hidden" name="id" value="" />
        <label class="field-label" for="entry-title">标题</label>
        <input class="text-field" id="entry-title" name="title" maxlength="100" placeholder="写下要记住的事" required />
        <label class="field-label" for="entry-body">补充内容</label>
        <textarea class="text-field text-area" id="entry-body" name="body" rows="4" maxlength="2000" placeholder="添加一些细节…"></textarea>
        <div class="task-fields" id="task-fields">
          <div class="field-row">
            <label class="field-grow"><span class="field-label">日期</span><input class="text-field" type="date" name="dueDate" /></label>
            <label class="field-grow"><span class="field-label">时间</span><input class="text-field" type="time" name="dueTime" /></label>
          </div>
          <label class="field-label" for="entry-repeat">重复</label>
          <select class="text-field" id="entry-repeat" name="repeat">
            <option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option>
          </select>
          <div class="reminder-field"><label class="pin-option reminder-option"><input type="checkbox" name="reminderEnabled" /><span class="checkmark"></span><span>添加闹钟提醒</span></label><p class="field-hint" id="reminder-help">选择日期和时间后可开启</p></div>
        </div>
        <div class="note-fields hidden" id="note-fields">
          <label class="field-label" for="entry-tag">标签</label>
          <select class="text-field" id="entry-tag" name="tag"><option value="工作">工作</option><option value="生活">生活</option><option value="灵感">灵感</option><option value="其他">其他</option></select>
          <label class="pin-option"><input type="checkbox" name="pinned" /><span class="checkmark"></span><span>置顶这条备忘</span></label>
        </div>
        <div class="dialog-actions">
          <button class="text-button danger hidden" id="delete-entry" type="button"><i data-lucide="trash-2"></i>删除</button>
          <span class="action-spacer"></span>
          <button class="secondary-button" id="cancel-editor" type="button">取消</button>
          <button class="primary-button" type="submit"><i data-lucide="check"></i><span id="save-label">保存</span></button>
        </div>
      </form>
    </dialog>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script src="assets/vendor/lucide.min.js"></script>
    <script src="cloudbase-config.js"></script>
    <script src="assets/vendor/cloudbase.bundle.js"></script>
    <script src="cloudbase-sync.js"></script>
    <script src="history-retention.js"></script>
    <script src="app.js"></script>
    <script>
      if (new URLSearchParams(location.search).get('migrate-storage') === '1') {
        document.addEventListener('DOMContentLoaded', () => {
          window.AndroidBridge?.completeLegacyStorageMigration(localStorage.getItem('daily-assistant-data-v1') || '');
        }, { once: true });
      }
    </script>
  </body>
</html>
